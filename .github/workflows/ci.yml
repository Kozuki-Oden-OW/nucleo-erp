name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pruebas rápidas de la lógica, el frontend y el sitio en Linux.
  linux:
    name: Linux · lógica, frontend y sitio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Sin valores normativos en el código
        run: python3 tools/check_normativa.py
      - name: Sitio web se construye sin marcadores pendientes
        run: python3 tools/build_web.py --out dist-web
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      # La app de escritorio incrusta la interfaz compilada: se construye antes que Rust.
      - name: Frontend (tipos, pruebas y compilación)
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas Rust
        run: cargo test --workspace
      - name: Rendimiento con 1 % del volumen (humo)
        run: |
          cargo run --release -p nucleo-tools --bin seed -- /tmp/b.db 0.01
          cargo run --release -p nucleo-tools --bin bench -- /tmp/b.db

  # Compilación real en Windows x64 + instalador NSIS (objetivo principal del producto).
  windows:
    name: Windows x64 · pruebas e instalador
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Instalar y compilar frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: Swatinem/rust-cache@v2
      - name: Pruebas Rust (incluye SQLCipher compilado en Windows)
        run: cargo test --workspace
      - name: Construir instalador
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis
      - name: Renombrar a NucleoERPSetup.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          Copy-Item $exe.FullName dist-installer/NucleoERPSetup.exe
          Get-FileHash dist-installer/NucleoERPSetup.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: NucleoERPSetup-windows-x64
          path: dist-installer/NucleoERPSetup.exe
          retention-days: 30
