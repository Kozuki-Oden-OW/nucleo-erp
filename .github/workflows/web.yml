name: Sitio web (www.nucleoerp.cl)

# Publica apps/web en GitHub Pages con dominio propio. Si existe una versión publicada
# (GitHub Release) con NucleoERPSetup.exe, lo incluye en /descargas/ con su SHA-256.
# "Publicar versión" lo dispara sobre main al terminar (el entorno github-pages solo admite main).
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "apps/desktop/src/**", "apps/desktop/package.json", "tools/build_web.py", ".github/workflows/web.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el instalador de la última versión (si existe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p installer
          if gh release download --repo "${{ github.repository }}" --pattern NucleoERPSetup.exe --dir installer; then
            echo "INSTALLER=installer/NucleoERPSetup.exe" >> "$GITHUB_ENV"
          else
            echo "Aún no hay versiones publicadas: el sitio mostrará 'muy pronto'."
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Construir la demostración navegable (/demo/)
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build:demo
      - name: Construir sitio
        run: |
          if [ -n "${INSTALLER:-}" ]; then
            python3 tools/build_web.py --out dist-web --demo apps/desktop/dist-demo --installer "$INSTALLER"
          else
            python3 tools/build_web.py --out dist-web --demo apps/desktop/dist-demo
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Avisa a Bing, Yandex, Seznam y otros buscadores (IndexNow) que el sitio cambió. Google se informa
  # por el sitemap registrado en Search Console. Si falla, no bloquea la publicación.
  indexnow:
    needs: deploy
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Enviar las páginas a IndexNow
        run: |
          read -r SITE KEY < <(python3 -c "import json;c=json.load(open('apps/web/site.config.json'));print(c['site_url'].rstrip('/'), c.get('indexnow_key',''))")
          if [ -z "$KEY" ]; then echo "Sin clave de IndexNow"; exit 0; fi
          HOST=$(python3 -c "import sys,urllib.parse;print(urllib.parse.urlparse(sys.argv[1]).netloc)" "$SITE")
          sleep 45
          curl -fsSL "$SITE/sitemap.xml" -o sitemap.xml
          python3 - "$SITE" "$HOST" "$KEY" > body.json <<'PY'
          import json, re, sys
          site, host, key = sys.argv[1:4]
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())
          print(json.dumps({"host": host, "key": key, "keyLocation": f"{site}/{key}.txt", "urlList": urls}))
          PY
          curl -sS -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @body.json -w "IndexNow respondió %{http_code}\n"
