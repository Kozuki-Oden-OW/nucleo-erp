name: Publicar versión

# Al crear una etiqueta vX.Y.Z (o al ejecutarlo a mano desde Actions → "Publicar versión" →
# "Run workflow"): compila el instalador en Windows, crea la versión (GitHub Release) con
# NucleoERPSetup.exe y su SHA-256, y actualiza www.nucleoerp.cl/descargar/.
#
# Firma de código (docs/FIRMA_CODIGO.md): si el repositorio tiene configurada la firma con
# SignPath (variable SIGNPATH_ORGANIZATION_ID y secreto SIGNPATH_API_TOKEN), el instalador se envía
# a firmar y se publica firmado; si no, se publica sin firma como hasta ahora.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. v0.1.0). Se crea la etiqueta sobre el commit elegido."
        required: true
        default: "v0.1.0"

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Validar versión
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versión inválida: $VERSION (formato vX.Y.Z)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Instalar y compilar frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: Swatinem/rust-cache@v2
      - name: Pruebas
        run: cargo test --workspace
      - name: Construir instalador
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis
      - name: Preparar instalador
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force unsigned, out | Out-Null
          Copy-Item $exe.FullName unsigned/NucleoERPSetup.exe
      - name: Subir instalador sin firma
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: instalador-sin-firma
          path: unsigned/NucleoERPSetup.exe
      - name: Firmar con SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'nucleo-erp' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Preparar archivos
        shell: pwsh
        run: |
          if (Test-Path signed/NucleoERPSetup.exe) {
            Copy-Item signed/NucleoERPSetup.exe out/NucleoERPSetup.exe
            $sig = Get-AuthenticodeSignature out/NucleoERPSetup.exe
            if ($sig.Status -ne 'Valid') { throw "La firma del instalador no es válida: $($sig.Status)" }
            "Instalador firmado por: $($sig.SignerCertificate.Subject)"
          } else {
            Copy-Item unsigned/NucleoERPSetup.exe out/NucleoERPSetup.exe
            "Instalador sin firma (SignPath no está configurado)."
          }
          $h = (Get-FileHash out/NucleoERPSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  NucleoERPSetup.exe" | Out-File -Encoding ascii out/NucleoERPSetup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: out/

  release:
    needs: installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador
          path: out
      - name: Crear versión en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" out/NucleoERPSetup.exe out/NucleoERPSetup.exe.sha256 \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "NÚCLEO ERP $VERSION" \
            --notes "Instalador para Windows 10/11 x64. Descarga oficial: https://www.nucleoerp.cl/descargar/"

  # El sitio se publica desde main: el entorno github-pages solo acepta despliegues de esa rama
  # (una etiqueta vX.Y.Z es rechazada). Se dispara web.yml sobre main, que descarga este instalador.
  web:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Actualizar www.nucleoerp.cl
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web.yml --repo "${{ github.repository }}" --ref main
