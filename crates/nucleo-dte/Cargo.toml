[package]
name = "nucleo-dte"
description = "Documentos tributarios electrónicos del SII (Chile): XML, timbre, firma y sobre de envío."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
openssl = { workspace = true }
# Proveedor «legacy» de OpenSSL 3: muchos .pfx de proveedores chilenos (y los exportados desde Windows)
# cifran el certificado con RC2-40, que OpenSSL 3 solo lee con ese proveedor.
openssl-src = { version = "300", features = ["legacy"] }
roxmltree = { workspace = true }
data-encoding.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
