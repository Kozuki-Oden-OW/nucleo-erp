[package]
name = "nucleo-app"
description = "Casos de uso de NÚCLEO ERP: transacciones, auditoría, empresas, respaldos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Guarda las claves de datos en el almacén seguro del sistema operativo
# (Windows Credential Manager / Keychain / keyutils). Lo activa la app de escritorio.
os-keyring = ["dep:keyring"]

[dependencies]
nucleo-domain.workspace = true
nucleo-db.workspace = true
nucleo-io.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
getrandom.workspace = true
tempfile.workspace = true
data-encoding.workspace = true
keyring = { workspace = true, optional = true, features = ["windows-native", "apple-native", "linux-native"] }

[dev-dependencies]
